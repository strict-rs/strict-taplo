# rustfmt config for this workspace.
#
# Several keys below are nightly-only (`imports_granularity`, `group_imports`,
# `wrap_comments`, `format_code_in_doc_comments`, `normalize_comments`,
# `comment_width`, `fn_params_layout`). They require `cargo +nightly fmt` and
# `unstable_features = true`. `just fmt` handles the toolchain switch.
edition                    = "2024"
style_edition              = "2024"
max_width                  = 140
tab_spaces                 = 2
newline_style              = "Unix"
hard_tabs                  = false
reorder_imports            = true
reorder_modules            = true
trailing_comma             = "Vertical"
trailing_semicolon         = true
use_field_init_shorthand   = true
use_try_shorthand          = true
match_block_trailing_comma = false
remove_nested_parens       = true
merge_derives              = true

# ── nightly-only features (require `cargo +nightly fmt`) ─────────────────────
unstable_features              = true
imports_granularity            = "Item"
group_imports                  = "StdExternalCrate"
wrap_comments                  = true
comment_width                  = 100
format_code_in_doc_comments    = true
format_macro_matchers          = true
format_macro_bodies            = true
normalize_comments             = true
normalize_doc_attributes       = true
fn_params_layout               = "Tall"
overflow_delimited_expr        = true
use_small_heuristics           = "Default"
condense_wildcard_suffixes     = true

# ── diagnostics + generated-file handling (nightly-only) ─────────────────────
format_generated_files         = true
print_misformatted_file_names  = true

chain_width = 80
array_width = 80
format_strings = true
struct_field_align_threshold = 20
enum_discrim_align_threshold = 20
force_explicit_abi = true
short_array_element_width_threshold = 30
struct_lit_single_line = false
struct_variant_width = 40
attr_fn_like_width = 80
single_line_if_else_max_width = 60

# ── explicit style intent (nightly-only except match_arm_leading_pipes) ──────
# Defaults restated on purpose so the workspace's layout/brace/spacing contract
# is self-documenting and survives any future style_edition default drift.
indent_style                   = "Block"
brace_style                    = "SameLineWhere"
control_brace_style            = "AlwaysSameLine"
match_arm_leading_pipes        = "Never"
fn_single_line                 = false
where_single_line              = false
skip_children                  = false
imports_layout                 = "Vertical"
doc_comment_code_block_width   = 100
space_before_colon             = false
space_after_colon              = true