[package]
name         = "xtask"
version      .workspace = true
edition      .workspace = true
license-file .workspace = true
authors      .workspace = true
repository   .workspace = true
publish      .workspace = true
readme       .workspace = true
description  = "Repository-specific `x` extension runner for the installed `template` workflow."
default-run  = "xtask"

[lib]
name = "xtask"
path = "src/lib.rs"

[[bin]]
name = "xtask"
path = "src/main.rs"

# disabled for now
# [lints]
# workspace = true

[dependencies]
template-core.workspace  = true
template-xtask.workspace = true

[dev-dependencies]
strict-test-support.workspace = true
