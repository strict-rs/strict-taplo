codespan-reporting = { version = "0.13.1" }
ansi_term     = { version = "0.12" }
async-ctrlc   = { version = "1.2.0", features = ["stream"] }
clap_complete = { version = "4.6.7" }
prettydiff    = { version = "0.9.0", default-features = false }               # `prettydiff` is also a CLI that pulls in `clap` by default
async-recursion    = { version = "1.1.1" }
json_value_merge   = { version = "2.0.1" }
jsonschema         = { version = "0.47.0", default-features = false }
lru                = { version = "0.18.1" }
percent-encoding   = { version = "2.3.2" }
rustls             = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
