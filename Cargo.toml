[workspace.metadata.config.contract.deny]
file = "deny.toml"

[workspace.metadata.config.contract.deny.sources.unknown-registry]
ownership = "template"
value = "deny"

[workspace.metadata.config.contract.deny.sources.unknown-git]
ownership = "template"
value = "deny"

[workspace.metadata.config.contract.deny.sources.allow-registry]
ownership = "template-with-consumer-entries"
required = ["https://github.com/rust-lang/crates.io-index"]
entry-type = "cargo-registry-url"
sort = true

[workspace.metadata.config.contract.deny.sources.allow-git]
ownership = "derived"
derive-from = ["cargo-deny.workspace-all-features.git-sources"]
include-template-required = false
include-consumer-declared = true
consumer-entries = "explicit-only"
remove-target-repository = true
remove-unencountered = true
entry-type = "cargo-deny-git-source-url"
sort = true

[workspace.metadata.config.update.cargo.workspace]
dependencies = [
  "agents-md",
  "anstyle",
  "bpaf",
  "cargo_metadata",
  "globset",
  "ignore",
  "parking_lot",
  "proc-macro2",
  "proptest",
  "serde_json",
  "snapbox",
  "strict-test-support",
  "strict-xtask-agents-md",
  "strict-xtask-cargo",
  "strict-xtask-core",
  "syn",
  "thiserror",
  "toml",
  "toml_edit",
  "trybuild",
]

[[workspace.metadata.config.update.cargo.manifest]]
path = "xtask/Cargo.toml"
dependencies = [
  "agents-md",
  "strict-xtask-agents-md",
  "strict-xtask-cargo",
  "strict-xtask-core",
]
dev-dependencies = ["strict-test-support"]

[workspace.metadata.config.update.guidance]
regenerate = true

[workspace.metadata.config.update.gitmodules]
path             = ".gitmodules"
preserve-unknown = true

[[workspace.metadata.config.update.gitmodules.submodules]]
id     = "agent-plugin.rust-template-core"
name   = ".agents/plugins/rust-template-core"
path   = ".agents/plugins/rust-template-core"
url    = "git@github.com:earthlings-dev/agent-plugin-rust-template.git"
branch = "main"

[workspace.metadata.config.gates]
schema-version = "0.1.0"
format         = ["rustfmt.toml"]
lint           = ["Cargo.toml", "clippy.toml"]
audit          = ["deny.toml"]
code-quality   = ["dupes.toml", ".jscpd.json"]
toolchain      = ["rust-toolchain.toml"]
github         = [".github/dependabot.yml", ".github/workflows/ci.yml", ".github/workflows/scheduled.yml"]
automation     = ["justfile"]
guidance       = ["AGENTS.md", "README.md", "crates/AGENTS.md", "xtask/AGENTS.md"]
repository     = [".gitattributes", ".gitmodules", "LICENSE"]

[[workspace.metadata.config.gates.rules]]
id       = "coverage-contract"
when-any = ["glob:cov/**", "glob:badges/**"]
command  = "just coverage --per-file"
reason   = "changed coverage policy, reports, or coverage-sensitive artifacts"
fallout  = ["Coverage workflows may refresh reports under `cov/` and the full badge set under `badges/`."]

[[workspace.metadata.config.gates.rules]]
id       = "feature-matrix"
when-any = ["path:Cargo.toml", "path:Cargo.lock", "glob:**/Cargo.toml"]
command  = "just hack"
reason   = "changed feature declarations or workspace dependency wiring"

[[workspace.metadata.config.gates.rules]]
id       = "tests-or-behavior"
when-any = ["glob:**/*.rs", "glob:**/tests/**", "glob:**/*.snap", "glob:**/*.stderr"]
command  = "just mutants"
reason   = "changed tests or behavior where missed assertions are plausible"

[[workspace.metadata.config.gates.rules]]
id       = "guidance"
when-any = ["glob:fragments/**", "glob:docs/fragments/**", "path:AGENTS.md", "glob:**/AGENTS.md", "path:README.md", "glob:**/README.md", "path:CLAUDE.md"]
command  = "just gen-md"
reason   = "changed generated-doc fragments or generated doc targets"
fallout  = ["Generated Markdown docs may be rewritten."]

[[workspace.metadata.config.gates.rules]]
id       = "plugins"
when-any = ["glob:.agents/plugins/**", "path:.gitmodules", "path:.agents/plugins/marketplace.json"]
command  = "skills-ref validate .agents/plugins/rust-template-core/skills/*"
reason   = "changed bundled agent skills or repo marketplace entries"

[[workspace.metadata.config.gates.rules]]
id        = "shared-workflow"
when-any  = ["glob:xtask/**", "glob:.github/workflows/**", "path:justfile", "path:clippy.toml", "path:rustfmt.toml", "path:deny.toml", "path:dupes.toml", "path:.jscpd.json", "path:rust-toolchain.toml", "path:template-lint.toml", "path:template-clippy.toml"]
command   = "just ci"
reason    = "changed shared workflow, policy, or xtask automation"
exclusive = true
fallout   = ["`just ci`, `just cq`, any coverage workflow, or the pre-commit hook may refresh `cov/tokei.json` and `badges/`."]

[[workspace.metadata.config.gates.rules]]
id       = "rust-code"
when-any = ["glob:**/*.rs", "path:Cargo.lock", "glob:**/Cargo.toml"]
command  = "just fmt && just lint && just test-all"
reason   = "changed Rust code or workspace manifests"

[workspace.metadata.config.agent-plugins]
schema-version = "0.1.0"
marketplace    = ".agents/plugins/marketplace.json"
plugins-root   = ".agents/plugins"
submodules     = ".gitmodules"

[[workspace.metadata.config.agent-plugins.plugins]]
id              = "rust-template-core"
path            = ".agents/plugins/rust-template-core"
manifest        = "plugin.json"
codex-manifest  = ".codex-plugin/plugin.json"
claude-manifest = ".claude-plugin/plugin.json"
skills          = "skills"
source          = { kind = "git", url = "git@github.com:earthlings-dev/agent-plugin-rust-template.git", branch = "main" }
