[workspace]
exclude = ["util/test-gen"]
members = ["crates/*", "xtask"]

resolver = "3"

[workspace.package]
authors      = ["tamasfe", "Takumi"]
edition      = "2024"
version = "0.15.0"
publish = false
license      = "MIT"
license-file = "LICENSE"
rust-version = "1.97"
homepage     = "https://github.com/strict-rs/strict-taplo"
repository   = "https://github.com/strict-rs/strict-taplo"

[workspace.dependencies]
lsp-async-stub = { version = "0.7.0", path = "crates/lsp-async-stub", default-features = false }
