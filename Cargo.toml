taplo-cli      = { version = "0.10.0", path = "crates/taplo-cli", default-features = false }
taplo-common = { version = "0.6.0", path = "crates/taplo-common", default-features = false }
taplo-lsp    = { version = "0.8.0", path = "crates/taplo-lsp", default-features = false }

ahash              = { version = "0.8.12" }
anyhow             = { version = "1.0.103" }
arc-swap           = { version = "1.9.2" }
async-trait        = { version = "0.1.89" }
clap               = { version = "4.6.1", default-features = false, features = ["std"] }
either             = { version = "1.16.0" }
futures            = { version = "0.3.32" }
getrandom          = { version = "0.4", default-features = false }
glob               = { version = "0.3" }
globset            = { version = "0.4.18" }
hex                = { version = "0.4" }
indexmap           = { version = "2.14" }
itertools          = { version = "0.15.0" }
lsp-types          = { version = "0.97.0" }
once_cell          = { version = "1.21" }
parking_lot        = { version = "0.12.5" }
