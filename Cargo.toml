[workspace]
exclude = ["util/test-gen"]
members = ["crates/*", "xtask"]

resolver = "3"

[workspace.package]
authors      = ["tamasfe", "Takumi"]
edition      = "2024"
version = "0.15.0"
publish = false
license      = "MIT"
license-file = "LICENSE"
rust-version = "1.97"
homepage     = "https://github.com/strict-rs/strict-taplo"
repository   = "https://github.com/strict-rs/strict-taplo"

[workspace.dependencies]
lsp-async-stub = { version = "0.15.0", path = "crates/lsp-async-stub", default-features = false }
taplo        = { version = "0.15.0", path = "crates/taplo", default-features = false }
taplo-cli      = { version = "0.15.0", path = "crates/taplo-cli", default-features = false }
taplo-common = { version = "0.15.0", path = "crates/taplo-common", default-features = false }
taplo-lsp    = { version = "0.15.0", path = "crates/taplo-lsp", default-features = false }

anyhow             = { version = "1.0.103" }
arc-swap           = { version = "1.9.2" }
async-trait        = { version = "0.1.89" }
clap               = { version = "4.6.1", default-features = false, features = ["std"] }
either             = { version = "1.16.0" }
futures            = { version = "0.3.32" }
getrandom          = { version = "0.4", default-features = false }
glob               = { version = "0.3" }
globset            = "0.4"
hex                = { version = "0.4" }
indexmap           = { version = "2.14" }
itertools          = { version = "0.15.0" }
lsp-types          = { version = "0.97.0" }
once_cell          = { version = "1.21" }
parking_lot        = "0.12"
regex              = { version = "1.13" }
reqwest            = { version = "0.13.4", default-features = false }
rowan              = { version = "0.17.0", git = "https://github.com/strict-rs/strict-rowan.git", branch = "upgrade"}
schemars           = { version = "1.2.1" }
serde              = { version = "1" }
serde_json         = "1"
sha1               = { version = "0.11.0" }
tap                = { version = "1.0.1" }
thiserror          = { version = "2"}
time               = { version = "0.3.53" }
tokio              = { version = "1.52.3", default-features = false }
toml               = "1.1"
tracing            = { version = "0.1.44", git = "https://github.com/strict-rs/strict-tracing.git", branch = "strict"}
tracing-subscriber = { version = "0.3.23", git = "https://github.com/strict-rs/strict-tracing.git", branch = "strict"}
url                = { version = "2.5.8" }

# Consolidated
logos      = { version = "0.16.1" }
codespan-reporting = { version = "0.13.1" }
ansi_term     = { version = "0.12" }
async-ctrlc   = { version = "1.2.0", features = ["stream"] }
clap_complete = { version = "4.6.7" }
prettydiff    = { version = "0.9.0", default-features = false }               # `prettydiff` is also a CLI that pulls in `clap` by default
async-recursion    = { version = "1.1.1" }
json_value_merge   = { version = "2.0.1" }
jsonschema         = { version = "0.47.0", default-features = false }
lru                = { version = "0.18.1" }
percent-encoding   = { version = "2.3.2" }
rustls             = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
semver             = { version = "1.0.28", features = ["serde"] }
figment     = { version = "0.10.19", features = ["json"] }
console_error_panic_hook = { version = "0.1.7" }
serde-wasm-bindgen       = { version = "0.6.5" }
# Bump all together since it's a monorepo
js-sys               = { version = "0.3.103" }
wasm-bindgen         = { version = "0.2.126" }
wasm-bindgen-futures = { version = "0.4.76" }

# Consolidated Dev Deps
assert-json-diff = { version = "2" }
criterion        = { version = "0.8" }   # criterion -> clap
difference       = { version = "2.0.0" }
pprof = { version = "0.16",  features = ["flamegraph", "criterion"], git = "https://github.com/strict-rs/strict-pprof-rs.git", branch = "upgrade" } # pprof -> criterion -> clap

bpaf = {  version = "0.10", default-features = false, git = "https://github.com/strict-rs/strict-bpaf.git", branch = "sync" }
template-core = { version = "0.1.0", git = "https://github.com/earthlings-dev/template-rs.git", branch = "main"}
template-xtask = { version = "0.1.0", git = "https://github.com/earthlings-dev/template-rs.git", branch = "main"}
trybuild = {  version = "1", git = "https://github.com/strict-rs/strict-trybuild.git", branch = "strict" }
strict-test-support = { version = "0.1.0", git = "https://github.com/earthlings-dev/strict-test-support-rs.git", branch = "main"}

syn         = { version = "2", features = ["full", "visit"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
cargo_metadata = "0.23"
ignore = "0.4"
toml_edit = "0.25"
anstyle = "1"
snapbox = { version = "1.2", features = ["diff"], default-features = false }
proptest = {  version = "2", features = ["std", "strict-test"], default-features = false, git = "https://github.com/strict-rs/strict-proptest.git", branch = "strict" }

