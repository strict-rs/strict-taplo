[toolchain]
# Day-to-day build, lint, test toolchain. Use `just fmt` for nightly rustfmt.
#
# Rolling stable: `stable` resolves to whatever `rustup update stable` last
# pulled. No MSRV pin — the template tracks the current stable toolchain.
channel    = "stable"
profile    = "minimal"
components = ["rustfmt", "clippy", "rust-src"]
