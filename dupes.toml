similarity_threshold = 0.9    # near-duplicate sensitivity (0.0..1.0)
min_nodes = 40     # ignore small AST fragments
min_lines = 8      # ignore short blocks
exclude = ["target"]
max_exact_duplicates = 0      # zero exact copy-paste
max_near_duplicates = 0      # zero near-duplicate groups at/above similarity_threshold

[token]
min_lines = 8                 # window-grain floor matches the documented min_lines

[line]
min_lines = 8                 # window-grain floor matches the documented min_lines
