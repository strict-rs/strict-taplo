[package]
name         = "taplo-lsp"
description  = "Language server for Taplo"
version      = { workspace = true }
rust-version = { workspace = true }
categories   = ["development-tools", "text-editors"]
keywords     = ["toml", "language-server", "lsp", "formatter", "linter"]
authors      = { workspace = true }
edition = { workspace = true }
homepage     = { workspace = true }
license      = { workspace = true }
repository   = { workspace = true }

[lib]
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[features]
default    = ["rustls-tls"]
native-tls = ["taplo-common/native-tls"]
rustls-tls = ["taplo-common/rustls-tls"]

[dependencies]
taplo-lsp-async = { workspace = true }
taplo          = { workspace = true, features = ["serde"] }
taplo-common   = { workspace = true, features = ["schema", "reqwest"] }

figment     = { workspace = true, features = ["json"] }
itertools   = { workspace = true }
lsp-types   = { workspace = true, features = ["proposed"] }
parking_lot = { workspace = true }
regex       = { workspace = true }
reqwest     = { workspace = true }
serde       = { workspace = true, features = ["derive"] }
serde_json  = { workspace = true, features = ["preserve_order"] }
thiserror   = { workspace = true }
toml        = { workspace = true }
tracing     = { workspace = true }
url         = { workspace = true, features = ["serde"] }

[dev-dependencies]
futures = { workspace = true }
time = { workspace = true, features = ["formatting", "parsing"] }
strict-test-support = { workspace = true }
taplo-test-support = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync"] }

[package.metadata.auto-tag]
enabled = true
