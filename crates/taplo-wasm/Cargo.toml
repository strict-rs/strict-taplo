[package]
name         = "taplo-wasm"
version      = "0.2.1"
publish      = false
rust-version = { workspace = true }
authors      = { workspace = true }
edition      = { workspace = true }
homepage     = { workspace = true }
license      = { workspace = true }
repository   = { workspace = true }

[lib]
crate-type = ["cdylib"]

[dependencies]
lsp-async-stub = { workspace = true }
taplo          = { workspace = true }
taplo-cli      = { workspace = true, optional = true, default-features = false }
taplo-common   = { workspace = true, default-features = false, features = ["rustls-tls", "schema", "reqwest"] }
taplo-lsp      = { workspace = true, optional = true, default-features = false }

anyhow                   = { workspace = true }
async-trait              = { workspace = true }
clap                     = { workspace = true, features = ["derive"] }
console_error_panic_hook = { workspace = true }
futures                  = { workspace = true }
getrandom                = { workspace = true, features = ["js"] }
indexmap                 = { workspace = true }
serde                    = { workspace = true, features = ["derive"] }
serde-wasm-bindgen       = { workspace = true }
serde_json               = { workspace = true }
time                     = { workspace = true, features = ["parsing"] }
tokio                    = { workspace = true }
tracing                  = { workspace = true }
url                      = { workspace = true }

# Bump all together since it's a monorepo
js-sys               = { workspace = true }
wasm-bindgen         = { workspace = true }
wasm-bindgen-futures = { workspace = true }

[features]
default = ["cli", "lsp"]
cli     = ["taplo-cli"]
lsp     = ["taplo-lsp"]
