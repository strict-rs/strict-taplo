[package]
name         = "taplo"
description  = "A TOML parser, analyzer and formatter library"
version      = "0.14.0"
rust-version = { workspace = true }
categories   = ["parser-implementations", "parsing"]
keywords     = ["toml", "parser", "formatter", "linter"]
readme       = false
authors      = { workspace = true }
edition      = { workspace = true }
homepage     = { workspace = true }
license      = { workspace = true }
repository   = { workspace = true }

[features]
default = ["serde"]
schema  = ["schemars"]

[dependencies]
ahash      = { workspace = true }
arc-swap   = { workspace = true }
either     = { workspace = true }
globset    = { workspace = true }
itertools  = { workspace = true }
logos      = { workspace = true }
once_cell  = { workspace = true }
rowan      = { workspace = true }
serde_json = { workspace = true }
thiserror  = { workspace = true }
time       = { workspace = true, features = ["parsing", "formatting", "macros"] }
tracing    = { workspace = true }

schemars = { workspace = true, optional = true }
serde    = { workspace = true, features = ["derive"], optional = true }

[dev-dependencies]
assert-json-diff = { workspace = true }
criterion        = { workspace = true }   # criterion -> clap
difference       = { workspace = true }
serde_json       = { workspace = true }
strict-test-support = { workspace = true }
toml             = { workspace = true }

[target.'cfg(unix)'.dev-dependencies]
pprof = { workspace = true, features = ["flamegraph", "criterion"] } # pprof -> criterion -> clap

[package.metadata.docs.rs]
features = ["serde", "schema"]

[package.metadata.auto-tag]
enabled = true

[[bench]]
harness = false
name    = "taplo"

[[bench]]
harness = false
name    = "profile"
