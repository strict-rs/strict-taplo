[package]
name         = "taplo-common"
description  = "Shared code for taplo utilities."
version      = "0.6.0"
rust-version = { workspace = true }
authors      = { workspace = true }
edition      = { workspace = true }
homepage     = { workspace = true }
license      = { workspace = true }
repository   = { workspace = true }

[features]
native-tls = ["reqwest/native-tls"]
# reqwest 0.13 dropped the `rustls-tls` feature; `rustls-no-provider` builds against
# rustls without bundling aws-lc-rs, so we install the ring CryptoProvider ourselves
# (see `util::get_reqwest_client`).
rustls-tls = ["reqwest/rustls-no-provider", "dep:rustls"]
schema     = []
reqwest    = ["dep:reqwest"]

[dependencies]
taplo = { workspace = true, features = ["schema", "serde"] }

ahash              = { workspace = true, features = ["serde"] }
anyhow             = { workspace = true }
arc-swap           = { workspace = true }
async-recursion    = { workspace = true }
async-trait        = { workspace = true }
futures            = { workspace = true }
glob               = { workspace = true }
globset            = { workspace = true }
hex                = { workspace = true }
indexmap           = { workspace = true, features = ["rayon", "serde"] }
itertools          = { workspace = true }
json_value_merge   = { workspace = true }
jsonschema         = { workspace = true, default-features = false }
lru                = { workspace = true }
parking_lot        = { workspace = true }
percent-encoding   = { workspace = true }
regex              = { workspace = true }
reqwest            = { workspace = true, features = ["json"], optional = true }
schemars           = { workspace = true, features = ["url2"] }
semver             = { workspace = true, features = ["serde"] }
serde              = { workspace = true, features = ["derive"] }
serde_json         = { workspace = true, features = ["preserve_order"] }
sha1               = { workspace = true }
tap                = { workspace = true }
thiserror          = { workspace = true }
time               = { workspace = true, features = ["serde"] }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
url                = { workspace = true, features = ["serde"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rustls = { workspace = true, optional = true }
tokio  = { workspace = true, features = ["fs", "io-std", "io-util", "parking_lot", "rt", "sync", "time"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio = { workspace = true, features = ["io-util", "parking_lot", "sync"] }

[package.metadata.auto-tag]
enabled = true
